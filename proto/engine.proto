// deluge-engine v1 protocol schema (spec §7).
//
// Framing (spec §7.1): each message on the Unix domain socket is prefixed by a 4-byte
// little-endian unsigned length (at most 16 MiB). Every frame carries either ToEngine
// (GUI -> Engine) or FromEngine (Engine -> GUI).
//
// C++ code is generated at build time by CMake. Python (tools/proto/) and Dart
// (gui/lib/proto/) code is generated by `python3 tools/gen_proto.py` and committed;
// CI runs `python3 tools/gen_proto.py --check` to ensure generated files stay in sync.
//
// Adding to the protocol (spec §7.6):
// - A ticket may add fields to an existing message without bumping protocol_version.
// - Adding a new kind of message raises PROTOCOL_VERSION_CURRENT, updates docs/spec.md
//   §7.4/§7.5 in the same PR, and regenerates Python and Dart code with tools/gen_proto.py.

syntax = "proto3";

package deluge.engine.proto;

// Single source of truth for the protocol version checked in Hello (spec §7.2).
// v1 requires an exact match; raise this when adding a new message kind (spec §7.6).
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 1;
}

// ---- Envelopes (spec §7.1) ----

message ToEngine {
  oneof kind {
    // Card, Setup, devices, lifecycle (spec §7.4)
    SetCard set_card = 1;
    SetSetup set_setup = 2;
    Audition audition = 3;
    Note note = 4;
    SetDevices set_devices = 5;
    Shutdown shutdown = 6;

    // Pieces and Renders (spec §7.5)
    RenderPiece render_piece = 7;
    CancelRender cancel_render = 8;
    Play play = 9;
    Seek seek = 10;
    Stop stop = 11;
    PlayPiece play_piece = 12;
    StopPiece stop_piece = 13;
  }
}

message FromEngine {
  oneof kind {
    // Session, card, Setup, devices, status (spec §7.2, §7.4, §7.7)
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    CardStatus card_status = 3;
    Catalog catalog = 4;
    Genres genres = 5;
    SetupApplied setup_applied = 6;
    MidiActivity midi_activity = 7;
    Devices devices = 8;
    Freeze freeze = 9;

    // Pieces and Renders (spec §7.5)
    RenderProgress render_progress = 10;
    RenderDone render_done = 11;
    RenderFailed render_failed = 12;
    Position position = 13;

    // Generic command/playback error reply (unimplemented command, audition full, missing WAV)
    ErrorReply error = 14;
  }
}

// ---- GUI -> Engine: card, Setup, devices, status (spec §7.4) ----

message SetCard {
  string folder = 1;
}

message SetupBinding {
  uint32 channel = 1; // MIDI channel 1..16
  string path = 2;    // card path, e.g. "SYNTHS/000 Rich Saw Bass.XML" or "KITS/000 TR-808.XML"
}

message SetSetup {
  repeated SetupBinding bindings = 1;
}

message Audition {
  string path = 1;     // preset path or card .wav sample path
  uint32 note = 2;     // MIDI note 0..127
  uint32 velocity = 3; // MIDI velocity 1..127
  uint32 ms = 4;       // audition duration in milliseconds
}

message Note {
  uint32 channel = 1;  // MIDI channel 1..16
  uint32 note = 2;     // MIDI note 0..127
  uint32 velocity = 3; // MIDI velocity 0..127
  bool on = 4;         // true = note on, false = note off
}

message SetDevices {
  string audio_output = 1;         // empty = system default output
  repeated string midi_inputs = 2; // empty = every MIDI input
}

message Shutdown {}

// ---- GUI -> Engine: Pieces and Renders (spec §7.5) ----

message SoundPick {
  oneof target {
    uint32 part = 1; // roster index (0..5)
    uint32 lane = 2; // firmware Lane index (0..14)
  }
  string path = 3; // card path to preset or sample
}

message Recipe {
  string genre = 1;              // stable genre id, e.g. "techno-dub"
  uint32 seed = 2;               // 0..2^32-1
  optional uint32 entropy = 3;   // unset => Engine uses seed (spec §6.1)
  repeated int32 macros = 4;     // empty (rolled/default) or 4 values (0..50): Energy, Density, Complexity, Motion
  optional double tempo = 5;     // BPM (e.g. 128.0); converted to hundredths of a BPM for firmware
  optional uint32 key = 6;       // pitch class 0..11 (0 = C)
  optional uint32 scale = 7;     // firmware Scale index 0..11
  optional int32 swing = 8;      // -49..49
  repeated SoundPick picks = 9;  // Part and lane sound picks; unset ones roll from Palette
  optional string scale_name = 10; // display name filled in RenderDone.recipe (optional on requests)
}

message RenderPiece {
  string id = 1;
  Recipe recipe = 2;
  double length_s = 3; // requested length in seconds (default 60, max 1200)
  string wav_path = 4; // destination WAV path owned by the GUI
}

message CancelRender {
  string id = 1;
}

message Play {
  string wav_path = 1;
  double position_s = 2;
}

message Seek {
  double position_s = 1;
}

message Stop {}

message PlayPiece {
  Recipe recipe = 1;
}

message StopPiece {}

// ---- Engine -> GUI: session, card, Setup, devices, status (spec §7.2, §7.4, §7.7) ----

message Hello {
  uint32 protocol_version = 1;      // matches ProtocolVersion.PROTOCOL_VERSION_CURRENT
  string engine_version = 2;        // e.g. "1.3.0-engine-e50ff0ea5"
  string firmware_commit = 3;       // firmware git commit SHA
  repeated string capabilities = 4; // subset of: "setups", "audition", "pieces", "render", "play_live"
}

message Heartbeat {
  uint32 voices = 1;
  float cpu_load = 2;
  uint64 underruns = 3;
}

message CardProgress {
  uint32 done = 1;
  uint32 total = 2;
}

message CardReady {}

message CardError {
  string text = 1;
}

message CardStatus {
  oneof state {
    CardProgress progress = 1;
    CardReady ready = 2;
    CardError error = 3;
  }
}

message PresetEntry {
  string path = 1; // card path, e.g. "SYNTHS/000 Rich Saw Bass.XML"
  string name = 2; // display name, e.g. "000 Rich Saw Bass"
}

message Catalog {
  repeated PresetEntry synths = 1;
  repeated PresetEntry kits = 2;
}

message PaletteEntry {
  string path = 1;   // card path to preset or sample
  uint32 weight = 2; // relative roll weight; share = weight / sum(weights)
}

message LaneInfo {
  uint32 index = 1; // firmware Lane enum index (0..14)
  string name = 2;  // display name, e.g. "Kick", "Snare", "Riser"
  repeated PaletteEntry palette = 3;
}

message PartInfo {
  uint32 index = 1; // roster index (0..5)
  string name = 2;  // part name, e.g. "DRUMS", "BASS", "FX"
  string role = 3;  // role name, e.g. "Drums", "Bass", "Chords", "Pad", "Lead", "FX"
  repeated PaletteEntry palette = 4;
  repeated LaneInfo lanes = 5;
}

message GenreInfo {
  string id = 1;   // stable id used in Recipe.genre, e.g. "techno-dub"
  string name = 2; // display name, e.g. "Dub Techno"
  repeated PartInfo parts = 3;
}

message Genres {
  repeated GenreInfo genres = 1;
}

message BindingResult {
  uint32 channel = 1;
  bool ok = 2;
  string error = 3;
}

message SetupApplied {
  repeated BindingResult results = 1;
}

message MidiActivity {
  uint32 channel = 1; // MIDI channel 1..16
}

message Devices {
  repeated string audio_outputs = 1;
  repeated string midi_inputs = 2;
}

message Freeze {
  string code = 1;    // firmware error code (e.g. "E380", "S002") or "HANG"
  string message = 2; // details / backtrace summary
  string loaded = 3;  // what was loaded when the freeze happened
}

message ErrorReply {
  string command = 1; // ToEngine field name (e.g. "set_card") or subsystem ("play")
  string message = 2; // human-readable error explanation
}

// ---- Engine -> GUI: Pieces and Renders (spec §7.5) ----

message RenderProgress {
  string id = 1;
  double done_s = 2;
  double total_s = 3;
}

message SectionMarker {
  string name = 1;
  double time_s = 2;
}

message PeakPair {
  float min = 1;
  float max = 2;
}

message TimelineNote {
  oneof target {
    uint32 part = 1; // roster index (0..5)
    uint32 lane = 2; // firmware Lane index (0..14)
  }
  double start_s = 3;
  double length_s = 4;
  uint32 pitch = 5;    // MIDI note 0..127
  uint32 velocity = 6; // MIDI velocity 1..127
}

message RenderDone {
  string id = 1;
  string wav_path = 2;
  double duration_s = 3;
  Recipe recipe = 4; // Recipe as played (all rolled fields and picks filled in)
  repeated SectionMarker sections = 5;
  repeated PeakPair peaks = 6; // ~2000 min/max pairs for waveform display
  repeated TimelineNote notes = 7;
  repeated string warnings = 8;
  uint32 peak_voices = 9;
}

message RenderFailed {
  string id = 1;
  string error = 2;
  string freeze_code = 3; // empty if not caused by a firmware freeze
}

message Position {
  string wav_path = 1;
  double time_s = 2;
}
