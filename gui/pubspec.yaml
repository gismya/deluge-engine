name: deluge_engine_gui
description: "Deluge Engine desktop GUI (spec §8)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  protobuf: ^6.1.0
  fixnum: ^1.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
