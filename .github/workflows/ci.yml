# Engine CI (spec §11): tools/check.py on a macOS arm64 runner, which is what agents run before pushing.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan (ASan + UBSan, -O1)
            steps: guards,asan,pointer-keys
          - name: release (-O2)
            steps: release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tools
        run: |
          brew install ninja
          cmake --version
          clang --version
      - name: Check
        run: python3 tools/check.py --only ${{ matrix.steps }}
      # Logs only: never audio or card images (AGENTS.md, spec §2).
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ strategy.job-index }}
          path: build/check/*.log
          retention-days: 7
